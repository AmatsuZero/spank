name: Release SDK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-sdk:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Configure private deps
        run: git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Build SDK artifacts
        run: |
          make build-mac-dylib
          make build-xcframework
          make build-android-sdk

      - name: Package xcframework for SPM
        run: |
          cd dist && zip -r Spank.xcframework.zip Spank.xcframework
          echo "CHECKSUM=$(shasum -a 256 dist/Spank.xcframework.zip | awk '{print $1}')" >> $GITHUB_ENV

      - name: Upload SDK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spank-sdk-${{ github.ref_name }}
          path: |
            dist/libspank.dylib
            dist/libspank.h
            dist/Spank.xcframework.zip
            dist/spank.aar

      - name: Create GitHub Release with xcframework
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Spank.xcframework.zip
          body: |
            ## SPM Integration

            ```swift
            .binaryTarget(
                name: "Spank",
                url: "https://github.com/AmatsuZero/spank/releases/download/${{ github.ref_name }}/Spank.xcframework.zip",
                checksum: "${{ env.CHECKSUM }}"
            )
            ```
