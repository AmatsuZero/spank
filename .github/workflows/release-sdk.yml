name: Release SDK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-sdk:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Configure private deps
        run: git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Build SDK artifacts
        run: |
          make build-mac-dylib
          make build-ios-sdk
          make build-android-sdk

      - name: Upload SDK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spank-sdk-${{ github.ref_name }}
          path: |
            dist/libspank.dylib
            dist/libspank.h
            dist/Spank.xcframework
            dist/spank.aar
