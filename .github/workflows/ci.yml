name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Configure private deps
        if: ${{ secrets.GH_PAT != '' }}
        run: git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Test all packages
        run: go test ./...

      - name: Build CLI default and lite
        run: |
          go build -tags with_assets ./cmd/spank
          go build -tags lite ./cmd/spank

      - name: Build binding entrypoints
        run: |
          go build ./bindings/mobile
          go build -buildmode=c-shared ./bindings/capi
